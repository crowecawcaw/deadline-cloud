# [FORK TEST] Stage 1 (collect) caller -> reusable workflow in the .github fork.
#
# Thin caller mirroring production. Points at the fork's fix branch
# (claude-review-fail-clean-on-no-pr) so the end-to-end reusable-workflow path is exercised before the
# upstream PR.
name: Claude PR Review (collect)

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-pr-review-collect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  collect:
    uses: crowecawcaw/deadline-cloud.github/.github/workflows/reusable_claude_pr_review_collect.yml@claude-review-fail-clean-on-no-pr
