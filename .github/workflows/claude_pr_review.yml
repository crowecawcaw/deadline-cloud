name: Claude PR Review

# Combined caller + reusable workflow for testing on crowecawcaw/deadline-cloud.
# In production, this is split into a caller (per-repo) plus a reusable workflow
# in aws-deadline/.github. See claude-code-action-pr-review.md threat model.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      # Mint a short-lived Bedrock bearer token from a dedicated IAM role.
      # The agent step never sees IAM credentials — only AWS_BEARER_TOKEN_BEDROCK.
      - name: Configure AWS credentials (OIDC, pre-step)
        id: aws
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: ${{ secrets.BEDROCK_ROLE_ARN }}
          aws-region: us-west-2
          role-duration-seconds: 900

      - name: Mint short-term Bedrock bearer token
        id: bedrock_token
        env:
          AWS_REGION: us-west-2
        run: |
          set -euo pipefail
          python3 -m pip install --quiet aws-bedrock-token-generator
          TOKEN=$(python3 -c "from aws_bedrock_token_generator import provide_token; print(provide_token())")
          echo "::add-mask::$TOKEN"
          # Persist to a file readable by the next step; mask it; then drop IAM creds.
          echo "AWS_BEARER_TOKEN_BEDROCK=$TOKEN" >> "$GITHUB_ENV"

      - name: Discard IAM credentials before agent step
        run: |
          # Wipe IAM creds out of the environment for subsequent steps.
          # The bearer token in $AWS_BEARER_TOKEN_BEDROCK survives in $GITHUB_ENV.
          {
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
            echo "AWS_DEFAULT_REGION=us-west-2"
            echo "AWS_REGION=us-west-2"
          } >> "$GITHUB_ENV"

      - name: Claude PR review
        uses: anthropics/claude-code-action@d2b7d924ec4af238380e490a0d57ce6bcc85ce8d # v1.0.123
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this pull request for AWS Deadline Cloud. Focus on correctness,
            security issues, and obvious bugs. Post inline comments on specific
            lines and one short top-level summary comment. Do not approve the PR.
            Do not request changes. Comments are advisory only.
          claude_args: |
            --model us.anthropic.claude-sonnet-4-5-20250929-v1:0
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ env.AWS_BEARER_TOKEN_BEDROCK }}
