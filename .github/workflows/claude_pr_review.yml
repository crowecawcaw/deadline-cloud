# [FORK TEST] Stage 2 (review) caller -> reusable workflow in the .github fork.
#
# Thin caller mirroring production. Triggered by completion of the Stage-1
# collect workflow. Points at the fork's fix branch so the reusable workflow
# (with the fork-PR resolve fix and the pinned-requirements checkout fix) is
# exercised end to end. Must live on the default branch for workflow_run to fire.
name: Claude PR Review

on:
  workflow_run:
    workflows: ["Claude PR Review (collect)"]
    types:
      - completed

concurrency:
  group: claude-pr-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    uses: crowecawcaw/deadline-cloud.github/.github/workflows/reusable_claude_pr_review.yml@claude-review-improvements
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      head_repository: ${{ github.event.workflow_run.head_repository.full_name }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      # Fork-test override: pull the pinned requirements file from the fork's fix
      # branch instead of the production default (aws-deadline/.github@mainline).
      tooling_repository: crowecawcaw/deadline-cloud.github
      tooling_ref: claude-review-improvements
    secrets:
      bedrock_role_arn: ${{ secrets.AWS_CLAUDE_PR_REVIEW_ROLE }}