name: DCM Integration Test

on:
  workflow_dispatch:

jobs:
  test:
    name: DCM E2E Test
    runs-on: ubuntu-latest
    environment: dcm-testing
    timeout-minutes: 20
    env:
      MONITOR_URL: ${{ secrets.MONITOR_URL }}
      MONITOR_USERNAME: ${{ secrets.MONITOR_USERNAME }}
      MONITOR_PASSWORD: ${{ secrets.MONITOR_PASSWORD }}
      MONITOR_ID: monitor-00000000000000000000000000000000
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libnss3 libgtk-3-0 libatk-bridge2.0-0 \
            libxss1 libasound2t64 libgbm1 libegl1 libgl1 libwebkit2gtk-4.1-0 libxdo3

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1

      - name: Install deadline CLI from source
        run: pip install .

      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps

      - name: Download and install DCM (AppImage)
        run: |
          APPIMAGE=$(curl -s https://downloads.deadlinecloud.amazonaws.com/manifest.json | python -c "import sys,json; print(json.load(sys.stdin)['latest']['linux_appimage'])")
          curl -sL "$APPIMAGE" -o /tmp/dcm.AppImage
          chmod +x /tmp/dcm.AppImage
          (cd /tmp && ./dcm.AppImage --appimage-extract >/dev/null)
          sudo tee /usr/local/bin/deadline-cloud-monitor >/dev/null <<'SH'
          #!/usr/bin/env bash
          cd /tmp/squashfs-root && exec ./AppRun "$@"
          SH
          sudo chmod +x /usr/local/bin/deadline-cloud-monitor

      - name: Create DCM profile
        run: |
          deadline-cloud-monitor create-profile \
            --profile dcm-test \
            --monitor-id "$MONITOR_ID" \
            --monitor-url "$MONITOR_URL" \
            --set-as-deadline-default

      - name: Run E2E test
        run: |
          # First: manually invoke DCM and capture everything
          echo "=== direct DCM login (with BROWSER shim) ==="
          mkdir -p /tmp/fake-browser
          cat > /tmp/fake-browser/xdg-open <<'SH'
          #!/usr/bin/env bash
          echo "[xdg-open] URL=$1" >> /tmp/drive-auth.log
          (agent-browser open "$1" && agent-browser wait --load networkidle) >> /tmp/drive-auth.log 2>&1 &
          SH
          chmod +x /tmp/fake-browser/xdg-open
          PATH="/tmp/fake-browser:$PATH" BROWSER=/tmp/fake-browser/xdg-open \
            timeout 30 deadline-cloud-monitor login --profile dcm-test 2>&1 | tee /tmp/dcm-direct.log || true
          echo "=== direct DCM exit code: $? ==="
          echo "=== xdg-open was it invoked? ==="
          cat /tmp/drive-auth.log 2>/dev/null || echo "(no driver log)"
          python .github/scripts/dcm_e2e_test.py

      - name: Dump logs on failure
        if: always()
        run: |
          echo "=== driver log ==="
          cat /tmp/drive-auth.log 2>/dev/null || echo "(none)"
          echo "=== DCM logs ==="
          find $HOME/.config/com.amazonaws.deadline.monitor \
               $HOME/.local/share/com.amazonaws.deadline.monitor \
               $HOME/.cache/com.amazonaws.deadline.monitor \
               -name "*.log" 2>/dev/null | xargs -r tail -n 200
          echo "=== aws config ==="
          cat ~/.aws/config 2>/dev/null || true
