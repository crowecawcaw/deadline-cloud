name: DCM Integration Test

on:
  workflow_dispatch:

jobs:
  test:
    name: DCM E2E Test
    runs-on: ubuntu-latest
    environment: dcm-testing
    timeout-minutes: 20
    env:
      MONITOR_URL: ${{ secrets.MONITOR_URL }}
      MONITOR_USERNAME: ${{ secrets.MONITOR_USERNAME }}
      MONITOR_PASSWORD: ${{ secrets.MONITOR_PASSWORD }}
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 at-spi2-core libnss3 libgtk-3-0 \
            libatk-bridge2.0-0 libxss1 libasound2t64 libgbm1 libegl1 libgl1 \
            libwebkit2gtk-4.1-0 libxdo3 libfuse2t64

      - name: Start Xvfb + a11y bus
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1
          /usr/libexec/at-spi-bus-launcher --launch-immediately &
          sleep 2

      - name: Install deadline CLI and xa11y
        run: pip install . xa11y

      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps

      - name: Download and install DCM (AppImage)
        run: |
          APPIMAGE=$(curl -s https://downloads.deadlinecloud.amazonaws.com/manifest.json | python -c "import sys,json; print(json.load(sys.stdin)['latest']['linux_appimage'])")
          curl -sL "$APPIMAGE" -o /usr/local/bin/deadline-cloud-monitor
          chmod +x /usr/local/bin/deadline-cloud-monitor

      - name: Run E2E test
        run: python .github/scripts/dcm_e2e_test.py
