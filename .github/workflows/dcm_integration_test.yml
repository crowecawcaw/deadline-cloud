name: DCM Integration Test

on:
  workflow_dispatch:

jobs:
  test:
    name: DCM E2E Test
    runs-on: ubuntu-latest
    environment: dcm-testing
    timeout-minutes: 20
    env:
      MONITOR_URL: ${{ secrets.MONITOR_URL }}
      MONITOR_USERNAME: ${{ secrets.MONITOR_USERNAME }}
      MONITOR_PASSWORD: ${{ secrets.MONITOR_PASSWORD }}
      MONITOR_ID: monitor-00000000000000000000000000000000
      DISPLAY: ':99'
      GTK_MODULES: gail:atk-bridge
      GTK_A11Y: atk
      GNOME_ACCESSIBILITY: '1'
      ACCESSIBILITY_ENABLED: '1'
      MOZ_ENABLE_WAYLAND: '0'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 at-spi2-core xdotool imagemagick \
            libnss3 libgtk-3-0 libatk-bridge2.0-0 libxss1 libasound2t64 \
            libgbm1 libegl1 libgl1 libwebkit2gtk-4.1-0 libxdo3 \
            libdbus-glib-1-2 desktop-file-utils

      - name: Install Firefox (tarball)
        run: |
          curl -sL 'https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US' -o /tmp/ff.tar.xz
          sudo tar -xJf /tmp/ff.tar.xz -C /opt
          sudo ln -sf /opt/firefox/firefox /usr/local/bin/firefox
          mkdir -p ~/.local/share/applications
          cat > ~/.local/share/applications/firefox.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Firefox
          Exec=/opt/firefox/firefox %u
          MimeType=x-scheme-handler/http;x-scheme-handler/https;
          Terminal=false
          EOF
          update-desktop-database ~/.local/share/applications
          xdg-mime default firefox.desktop x-scheme-handler/http
          xdg-mime default firefox.desktop x-scheme-handler/https

      - name: Start Xvfb + session bus + AT-SPI
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          /usr/libexec/at-spi-bus-launcher --launch-immediately &
          sleep 2

      - name: Install deadline CLI, xa11y, jeepney
        run: pip install . xa11y jeepney

      - name: Start persistent AT-SPI client (enables webkit2gtk a11y)
        run: |
          nohup python .github/scripts/a11y_client.py > /tmp/a11y_client.log 2>&1 &
          sleep 2
          cat /tmp/a11y_client.log

      - name: Install DCM (AppImage)
        run: |
          APPIMAGE=$(curl -s https://downloads.deadlinecloud.amazonaws.com/manifest.json | python -c "import sys,json; print(json.load(sys.stdin)['latest']['linux_appimage'])")
          curl -sL "$APPIMAGE" -o /tmp/dcm.AppImage
          chmod +x /tmp/dcm.AppImage
          (cd /tmp && ./dcm.AppImage --appimage-extract >/dev/null)
          sudo tee /usr/local/bin/deadline-cloud-monitor >/dev/null <<'SH'
          #!/usr/bin/env bash
          cd /tmp/squashfs-root && exec ./AppRun "$@"
          SH
          sudo chmod +x /usr/local/bin/deadline-cloud-monitor

      - name: Register deadline-cloud-monitor:// scheme handler
        run: |
          mkdir -p ~/.local/share/applications
          cat > ~/.local/share/applications/deadline-cloud-monitor.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Deadline Cloud monitor
          Exec=deadline-cloud-monitor handle-url --url %u
          MimeType=x-scheme-handler/deadline-cloud-monitor;
          Terminal=false
          NoDisplay=true
          EOF
          update-desktop-database ~/.local/share/applications
          xdg-mime default deadline-cloud-monitor.desktop x-scheme-handler/deadline-cloud-monitor

      - name: Create DCM profile
        run: |
          deadline-cloud-monitor create-profile --profile dcm-test \
            --monitor-id "$MONITOR_ID" --monitor-url "$MONITOR_URL" \
            --enable-auto-login --set-as-deadline-default
          sed -i 's|^path=.*|path=/usr/local/bin/deadline-cloud-monitor|' ~/.deadline/config
          cat ~/.deadline/config

      - name: Run E2E test
        run: python .github/scripts/dcm_e2e_test.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/*.png
          if-no-files-found: ignore
